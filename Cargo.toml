[package]
name = "kanban"
version = "0.1.0"
edition = "2024"
description = "A simple native kanban board"
license = "MIT"
authors = ["Reed Graf"]
readme = "README.md"
repository = "https://github.com/ReedGraf/kanban-app-rust"

[dependencies]
dirs = "7.0.0"
eframe = "0.36.2"
egui_extras = { version = "0.36.2", features = ["datepicker"] }
jiff = { version = "0.2.37", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
lto = true
strip = true
codegen-units = 1

[package.metadata.deb]
maintainer = "Reed Graf"
section = "utils"
extended-description = "A simple native kanban board with columns, due dates, color labels, tags and an archive."
depends = "$auto, libxkbcommon0, libwayland-client0, libgl1"
assets = [
    ["target/release/kanban", "usr/bin/", "755"],
    ["assets/kanban.desktop", "usr/share/applications/", "644"],
    ["assets/kanban.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["README.md", "usr/share/doc/kanban/README", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/kanban", dest = "/usr/bin/kanban", mode = "755" },
    { source = "assets/kanban.desktop", dest = "/usr/share/applications/kanban.desktop", mode = "644" },
    { source = "assets/kanban.svg", dest = "/usr/share/icons/hicolor/scalable/apps/kanban.svg", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/kanban/README.md", mode = "644", doc = true },
]
auto-req = "auto"

[package.metadata.generate-rpm.requires]
"libxkbcommon.so.0()(64bit)" = "*"
"libwayland-client.so.0()(64bit)" = "*"
"libGL.so.1()(64bit)" = "*"
